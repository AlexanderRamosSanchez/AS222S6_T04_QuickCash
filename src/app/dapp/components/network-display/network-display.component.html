<div class="network-display" *ngIf="etherService.network()">
    <div class="network-card" [style.border-color]="getNetworkColor()">
        <div class="network-icon" [style.background-color]="getNetworkColor()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="24" height="24">
                <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z" />
                <path d="M12 17l-5-5h10l-5 5z" />
            </svg>
        </div>
        
        <div class="network-info">
            <div class="network-name">{{ etherService.getNetworkName() }}</div>
            <div class="network-chain">Chain ID: {{ etherService.network()?.chainId }}</div>
        </div>
        
        <div class="network-actions">
            <button class="change-network-btn" (click)="showNetworkOptions = !showNetworkOptions" [disabled]="isNetworkSwitching">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                    <path d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
                </svg>
                {{ isNetworkSwitching ? 'Cambiando...' : 'Cambiar Red' }}
            </button>
        </div>
    </div>
    
    <div *ngIf="showNetworkOptions && !isNetworkSwitching" class="network-options">
        <ul class="network-list">
            <li *ngFor="let network of availableNetworks" class="network-item">
                <button
                    [class.active]="etherService.network()?.chainId === network.chainId"
                    [disabled]="etherService.network()?.chainId === network.chainId || isNetworkSwitching"
                    (click)="switchNetwork(network.chainId)"
                >
                    <div class="network-dot" [style.background-color]="getNetworkColorById(network.chainId)"></div>
                    <span>{{ network.name }}</span>
                </button>
            </li>
        </ul>
    </div>
    
    <!-- Indicador de cambio de red -->
    <div *ngIf="isNetworkSwitching" class="network-switching-indicator">
        <div class="spinner"></div>
        <p>Cambiando de red...</p>
    </div>
</div>
